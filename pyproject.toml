[project]
name = "soklar-sms"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "flet==1.1.2",
    "httpx>=0.28.1",      # <-- Actualizado: ahora cumple con el requisito de Flet
    "pydantic==2.11.7",
    "python-dotenv==1.0.1",
]

[tool.flet]
org = "cu.soklar"
product = "SOKLAR SMS"

[tool.flet.app]
path = "src"
module = "main"

[tool.flet.android.permissions]
"android.permission.RECEIVE_SMS" = true
"android.permission.READ_SMS" = true
"android.permission.SEND_SMS" = true
"android.permission.INTERNET" = true
