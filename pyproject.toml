[project]
name = "soklar-sms"
version = "1.0.0"
description = "SOKLAR SMS - Conector POS"
requires-python = ">=3.11"
dependencies = [
    "flet==0.25.0",
    "httpx==0.27.2",
    "pydantic==2.9.2",
    "python-dotenv==1.0.1",
]

[tool.flet]
org = "cu.soklar"
product = "SOKLAR SMS"

[tool.flet.app]
path = "src"
module = "main"

[tool.flet.android.permissions]
"android.permission.RECEIVE_SMS" = true
"android.permission.READ_SMS" = true
"android.permission.SEND_SMS" = true
"android.permission.INTERNET" = true