name: Build APK

on:
  #push:
    #branches: [main]
    #tags: ['v*']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install system deps (p4a/buildozer)
        run: |
          sudo apt-get update
          
          # Instalar libtinfo5 manualmente (ya no está en Ubuntu 24.04)
          wget http://security.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2ubuntu0.2_amd64.deb
          sudo apt install -y ./libtinfo5_6.3-2ubuntu0.2_amd64.deb
          
          # Ahora sí, el resto de dependencias (sin libtinfo5 en la lista)
          sudo apt-get install -y \
            build-essential git zip unzip openjdk-17-jdk autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev libltdl-dev

      - name: Install Flet CLI
        run: pip install "flet[cli]==0.24.1"

      - name: Install app deps
        run: pip install -r requirements.txt

      - name: Build APK (solo esqueleto)
        run: |
          flet build apk \
            --build-version 1.0.0 \
            --build-number ${{ github.run_number }} \
            --project "SOKLAR SMS" \
            --org "cu.soklar" \
            --module-name "main" \
            --verbose

      # Flet deja el proyecto Android en build/apk/
      - name: Inject SmsReceiver stub
        run: |
          python android-stub/copy_into_build.py build/apk

      - name: Recompile APK with stub
        working-directory: build/apk/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -x lint

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          APK=$(find build/apk/android/app/build/outputs/apk/release -name "*.apk" | head -n1)
          BT=$(ls $ANDROID_HOME/build-tools | sort -V | tail -n1)
          $ANDROID_HOME/build-tools/$BT/apksigner sign \
            --ks release.keystore \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out soklar-sms.apk "$APK"
          rm -f release.keystore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: soklar-sms-apk
          path: soklar-sms.apk
          if-no-files-found: error